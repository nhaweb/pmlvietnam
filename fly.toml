# fly.toml app configuration file generated for pmlvietnam on 2026-09-15T13:52:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pmlvietnam'
primary_region = 'nrt'

[build]

[env]
  HOSTNAME = '0.0.0.0'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
