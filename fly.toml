# fly.toml app configuration file generated for nha-web on 2026-09-13T16:44:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nha-web'
primary_region = 'iad'

[build]

[env]
  PORT = '8080'
  HOSTNAME = '0.0.0.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
